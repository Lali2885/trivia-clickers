<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>טריוויה קליקרים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#0f1418; --bg2:#263238; --card:#ffffff; --ink:#1d1d2b; --muted:#6b6b80;
  --line:#e3e1ee; --primary:#25BDF0; --ok:#26890c; --bad:#e21b3c;
  --a0:#e21b3c; --a1:#1368ce; --a2:#d89e00; --a3:#26890c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Rubik',system-ui,sans-serif;background:radial-gradient(900px 650px at 90% -10%,rgba(37,189,240,.32),transparent 60%),radial-gradient(800px 600px at 0% 110%,rgba(240,82,53,.24),transparent 60%),linear-gradient(160deg,#3d5361,#26363f);background-attachment:fixed;color:#fff;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
#banner{background:#ffcc00;color:#3a2a00;text-align:center;padding:8px 16px;font-size:14px;font-weight:500;display:none}
#banner.show{display:block}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.top h1{font-size:40px;font-weight:900;margin:0}
.top .sub{opacity:.8;margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.btn{border:0;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;color:var(--bg2);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(90deg,#F05235,#25BDF0);color:#fff}
.btn.ghost{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.btn.big{font-size:22px;padding:16px 30px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.set{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.set h3{margin:0;font-size:20px}
.set .meta{color:var(--muted);font-size:14px}
.set .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.set .row .btn{box-shadow:none;border:1px solid var(--line);padding:8px 12px;font-size:14px}
.set .row .btn.primary{border-color:transparent}
.foot{margin-top:30px;opacity:.75;font-size:14px;word-break:break-all}
.empty{opacity:.8;padding:30px;text-align:center}

/* editor */
.title-in{width:100%;font-size:26px;font-weight:700;padding:12px 16px;border-radius:12px;border:0;margin-bottom:16px}
.qcard{background:#fff;color:var(--ink);border-radius:14px;padding:16px;margin-bottom:14px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qnum{background:var(--bg2);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:700}
.qhead select{padding:7px;border-radius:8px;border:1px solid var(--line)}
.sp{flex:1}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:34px;font-size:15px}
.qcard textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:18px;resize:vertical}
.ans-ed{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ae{display:flex;align-items:center;gap:8px;border:2px solid var(--c);border-radius:10px;padding:6px 8px}
.ae .shape{background:var(--c);color:#fff;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;font-size:14px;flex:none}
.ae input[type=text],.ae input:not([type]){flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:6px 2px}
.ae input[type=radio]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.tfl{font-weight:700;padding:6px 2px}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.add{width:100%;padding:16px;font-size:18px}

/* host stage */
.stage{min-height:100vh;display:flex;flex-direction:column;padding:20px 28px;position:relative;z-index:1}
.ico{width:1em;height:1em;display:block}
.wrap,.pwrap{position:relative;z-index:1}
.djlogo{display:none}
.eq{display:none}

/* ===== ערכת DJ — צבעי הלוגו של ללי שטרן ===== */
body.theme-dj{--bg:#11171c;--bg2:#263238;--primary:#25BDF0;--bad:#F05235;--ok:#1fb86a;
  background:radial-gradient(circle at 15% 0%,rgba(37,189,240,.28) 0,transparent 45%),radial-gradient(circle at 95% 100%,rgba(240,82,53,.28) 0,transparent 45%),linear-gradient(160deg,#263238,#11171c);background-attachment:fixed}
.theme-dj .btn.primary{background:#25BDF0;color:#0d2430}
.theme-dj .btn{color:#263238}
.theme-dj .btn.ghost{color:#fff;background:rgba(255,255,255,.12)}
.theme-dj .pill{background:rgba(37,189,240,.18);border:1px solid rgba(37,189,240,.4)}
.theme-dj .qtext{border-bottom:6px solid #F05235}
.theme-dj .ans .shape{font-size:46px}
.theme-dj .pbtn .shape{font-size:56px}
.theme-dj .ae .shape{font-size:20px}
.theme-dj .tbar>div{background:linear-gradient(90deg,#F05235,#25BDF0)}
.theme-dj .tbar.low>div{background:#F05235}
.theme-dj .timer{position:relative;background:repeating-radial-gradient(circle,#0c0f12 0 3px,#1d2328 3px 5px);border-color:#25BDF0;color:#fff;text-shadow:0 2px 8px #000}
.theme-dj .timer::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:6px solid transparent;border-top-color:#F05235;animation:spin 1.4s linear infinite}
.theme-dj .timer.low{background:repeating-radial-gradient(circle,#2a0d08 0 3px,#3a140c 3px 5px);border-color:#F05235}
.theme-dj .ptimer{background:#0c0f12;border-color:#25BDF0}
.theme-dj .ptimer.low{background:#F05235}
.theme-dj .joinbox .code{color:#263238}
.theme-dj .joinbox .code{background:linear-gradient(90deg,#25BDF0,#F05235);-webkit-background-clip:text;background-clip:text;color:transparent}
.theme-dj .brow .r{color:#F05235}
.theme-dj .qnum{background:#263238}
.theme-dj .tab.on{color:#263238}
.theme-dj .kpi{border-top-color:#25BDF0}.theme-dj .kpi b{color:#263238}
.theme-dj .tog input:checked+.sw{background:#25BDF0}
.theme-dj .chip{border-inline-start:5px solid #25BDF0}
.theme-dj .djlogo{display:block;background:#fff;border-radius:16px;padding:8px 14px}
.theme-dj .djlogo img{display:block;width:100%;height:auto}
.theme-dj .joinbox .djlogo{width:250px;margin:0 auto 10px;padding:0}
.theme-dj .stage-top .djlogo{width:120px;padding:4px 8px;border-radius:10px}
.theme-dj .pwrap .djlogo{width:240px;margin:0 auto}
.theme-dj .pwrap .logo{display:none}
.theme-dj .eq{display:flex;position:fixed;left:0;right:0;bottom:0;height:70px;gap:5px;align-items:flex-end;opacity:.22;pointer-events:none;z-index:0;padding:0 6px}

/* ===== מסכי ניהול — עיצוב בהיר בצבעי המותג ===== */
body.admin{--a-text:#263238;--a-muted:#6b7c85;--a-card:#fff;--a-line:#e3eaee;
  background:radial-gradient(900px 600px at 90% -10%,rgba(37,189,240,.16),transparent 60%),radial-gradient(800px 600px at 0% 110%,rgba(240,82,53,.12),transparent 60%),#f4f7f9;
  background-attachment:fixed;color:var(--a-text)}
body.admin .eq{display:none}
body.admin .wrap{max-width:1100px}
.grad{background:linear-gradient(90deg,#F05235,#25BDF0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:18px}
.alogo{background:#fff;border-radius:16px;padding:6px 10px;width:140px;box-shadow:0 8px 26px rgba(37,189,240,.22);flex:none}
.alogo img{display:block;width:100%;height:auto}
.ahead h1{font-size:40px;font-weight:900;margin:0;line-height:1.1}
.ahead .sub{color:var(--a-muted);margin-top:6px}
.a-slogan{font-weight:900;font-size:22px}
.statsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mini{background:#fff;border:1px solid var(--a-line);border-radius:16px;padding:14px 18px;box-shadow:0 4px 16px rgba(38,50,56,.05)}
.mini b{display:block;font-size:30px;font-weight:900;line-height:1.2}
.mini span{color:var(--a-muted);font-size:13px}
body.admin .btn{background:#fff;color:var(--a-text);border:1px solid #d9e2e7;box-shadow:0 2px 6px rgba(38,50,56,.05);border-radius:12px;transition:background .15s,transform .15s,filter .15s}
body.admin .btn:hover{background:#f0f5f8}
body.admin .btn:active{transform:translateY(1px)}
body.admin .btn.primary{background:linear-gradient(90deg,#F05235,#25BDF0);border:0;color:#fff;box-shadow:0 6px 18px rgba(240,82,53,.25)}
body.admin .btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
body.admin .btn.ghost{background:transparent;box-shadow:none}
body.admin .btn:disabled{opacity:.4;transform:none;filter:none}
body.admin .sets{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
body.admin .set{background:#fff;border:1px solid var(--a-line);color:var(--a-text);border-radius:18px;padding:20px 18px 18px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;gap:12px;box-shadow:0 4px 18px rgba(38,50,56,.06)}
body.admin .set::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#F05235,#25BDF0)}
body.admin .set.classic::before{background:linear-gradient(90deg,#e21b3c,#1368ce,#d89e00,#26890c)}
body.admin .set:hover{transform:translateY(-3px);border-color:rgba(37,189,240,.5);box-shadow:0 14px 30px rgba(38,50,56,.12)}
.sethead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;background:rgba(37,189,240,.13);color:#127ea6;border-radius:999px;padding:3px 11px}
.set.classic .tag{background:#eef2f4;color:#55656d}
.acts{display:flex;gap:2px}
.icb{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:#8a9aa3;font-size:15px;display:grid;place-items:center}
.icb:hover{background:#eef3f6;color:var(--a-text)}
.icb.del:hover{background:#fde8e4;color:#d4432a}
body.admin .set h3{font-size:22px;margin:0}
body.admin .set .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--a-muted);font-size:13.5px}
body.admin .set .row{display:flex;gap:8px}
body.admin .set .row .btn{padding:10px 14px;font-size:15px;border:1px solid #d9e2e7}
body.admin .set .row .btn.primary{flex:1;border:0}
body.admin .newcard{border:2px dashed #c9d6dd;background:rgba(255,255,255,.5);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:17px;font-weight:700;color:var(--a-muted);min-height:180px;cursor:pointer;font-family:inherit}
body.admin .newcard::before{display:none}
body.admin .newcard span{font-size:44px;line-height:1;color:#25BDF0}
body.admin .newcard:hover{color:var(--a-text);border-color:#25BDF0;background:#fff}
body.admin .foot{color:var(--a-muted);background:#fff;border:1px solid var(--a-line);border-radius:12px;padding:12px 16px}
body.admin .foot b{color:#127ea6}
body.admin .empty{color:var(--a-muted)}
body.admin .title-in{background:#fff;color:var(--a-text);border:1px solid var(--a-line);box-shadow:0 4px 16px rgba(38,50,56,.05)}
body.admin ::placeholder{color:#9aabb3}
body.admin .tabs{background:#fff;padding:5px;border-radius:14px;border:1px solid var(--a-line);box-shadow:0 4px 16px rgba(38,50,56,.05)}
body.admin .tab{background:transparent;color:var(--a-muted);border-radius:10px}
body.admin .tab:hover{color:var(--a-text);background:#f4f7f9}
body.admin .tab.on{background:linear-gradient(90deg,#F05235,#25BDF0);color:#fff}
body.admin .qcard,body.admin .scard,body.admin .kpi,body.admin .run{background:#fff;border:1px solid var(--a-line);color:var(--a-text);box-shadow:0 4px 16px rgba(38,50,56,.05)}
body.admin .qnum{background:linear-gradient(135deg,#F05235,#25BDF0)}
body.admin select,body.admin textarea,body.admin .fld input,body.admin .fld select{background:#f7fafb;color:var(--a-text);border:1px solid #d9e2e7}
body.admin .ae{background:#fff}
body.admin .ae input:not([type=radio]){background:transparent;color:var(--a-text)}
body.admin .ib{background:#f4f7f9;border-color:#d9e2e7;color:#455a64}
body.admin .ib:hover{background:#e8eff3}
body.admin .hint,body.admin .fld,body.admin .chk small,body.admin .kpi span{color:var(--a-muted)}
body.admin .mb{background:#fff;border-color:#d9e2e7;color:var(--a-text)}
body.admin .mb:hover{background:#f0f5f8}
body.admin .btn.add{border:2px dashed #c9d6dd;background:rgba(255,255,255,.5);box-shadow:none;color:var(--a-muted)}
body.admin .btn.add:hover{color:var(--a-text);border-color:#25BDF0;background:#fff}
body.admin .scard h3{border-bottom-color:var(--a-line)}
body.admin .sw{background:#cfd8dc}
body.admin .tog input:checked+.sw{background:linear-gradient(90deg,#F05235,#25BDF0)}
body.admin .summary span{background:#eef3f6;color:#455a64}
body.admin .kpi{border-top:4px solid #25BDF0}
body.admin .kpi b{color:var(--a-text)}
body.admin .runhead:hover{background:#f7fafb}
body.admin .runbody{border-top-color:var(--a-line)}
body.admin .tbl th{color:var(--a-muted);border-bottom-color:var(--a-line)}
body.admin .tbl td{border-bottom-color:#eef2f4}
body.admin .hard td{background:#fdeeea}
body.admin .slot.on{outline-color:var(--a-text)}
body.admin .qcard.flash{outline-color:#F05235}
body.admin .chk.ok .ic{background:#1fb86a}
/* כניסה, אירועים ללקוחות */
.login{max-width:520px;margin:30px auto;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.login .alogo{width:190px}
.login h1{font-size:40px;font-weight:900;margin:0}
.lg-card{background:#fff;border:1px solid #e3eaee;border-radius:18px;padding:22px;width:100%;box-shadow:0 6px 22px rgba(38,50,56,.07);color:#263238}
.lg-card h3{margin:0 0 14px;font-size:19px}
.lg-row{display:flex;gap:8px}
.lg-row input{flex:1;padding:12px;border-radius:12px;border:1px solid #d9e2e7;font-size:20px;text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.lg-link{display:inline-block;margin-top:14px;color:#127ea6;font-weight:700;text-decoration:none}
.lg-err{margin-top:12px;color:#d4432a;font-weight:500}
.poweredby{display:flex;align-items:center;gap:10px;color:#6b7c85;font-size:13px;margin-top:6px}
.poweredby img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
.evpage h1{font-size:34px;margin:6px 0 4px}
.evpage .sub{color:#6b7c85;margin-bottom:14px}
.evpage-logo{max-width:260px;max-height:170px;border-radius:14px}
.evpage .btn.big{margin-top:18px}
.hometabs{margin:18px 0 4px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:#6b7c85}
.who button{border:1px solid #d9e2e7;background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;color:#263238}
.evhead{display:flex;gap:12px;align-items:center}
.evhead img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#f4f7f9;flex:none}
.evcode{font-family:monospace;font-size:22px;font-weight:700;letter-spacing:3px;color:#127ea6;background:#eef7fb;border-radius:10px;padding:6px 12px;align-self:flex-start;direction:ltr}
.tag.st-live{background:#e3f7ec;color:#13824b}.tag.st-future{background:#fff4d6;color:#8a6200}.tag.st-past{background:#eef2f4;color:#6b7c85}
body.admin .set.ev.past{opacity:.7}
body.admin .set.ev::before{background:linear-gradient(90deg,#25BDF0,#1fb86a)}
.evlogo{max-height:70px;max-width:160px;border-radius:8px;border:1px solid #e3eaee;background:#fff}
.linkbox{background:#f4f7f9;border:1px solid #e3eaee;border-radius:10px;padding:10px 12px;font-size:14px;word-break:break-all}
.qtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.evbrand{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.evbrand img{max-height:120px;max-width:260px;background:#fff;border-radius:14px;padding:6px}
.evbrand h1{margin:0;font-size:42px;font-weight:900;line-height:1.1}
.clickonly{padding:30px 10px}
.clickonly .big{font-size:80px}
.clickonly h2{color:var(--ink);margin:10px 0}
.slogan{display:none}
.theme-dj .slogan{display:inline-block;font-weight:900;font-size:26px;background:linear-gradient(90deg,#F05235,#25BDF0);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.theme-dj .slogan.big{display:block;font-size:46px;margin-bottom:18px}
.theme-dj .pwrap .slogan{display:block;font-size:22px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slot{border:0;border-radius:10px;color:#fff;padding:10px 4px 8px;font-size:36px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.slot small,.gi small{font-size:12px;font-weight:500}
.slot.on{outline:3px solid #263238;outline-offset:3px}
.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px;background:#263238;padding:10px;border-radius:12px}
.gi{border:0;background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:9px 2px 7px;font-size:30px;display:flex;flex-direction:column;align-items:center;gap:5px}
.gi:hover{background:rgba(37,189,240,.35)}
.gi.on{background:#25BDF0}
.eq i{flex:1;height:100%;border-radius:3px 3px 0 0;background:linear-gradient(#F05235,#25BDF0);transform-origin:bottom;animation:eqb .9s ease-in-out infinite alternate}
@keyframes eqb{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:rgba(255,255,255,.15);border-radius:999px;padding:8px 16px;font-weight:700}
.lobby{flex:1;display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;margin-top:20px}
.joinbox{background:#fff;color:var(--ink);border-radius:20px;padding:24px;text-align:center}
.joinbox .lbl{color:var(--muted);font-size:16px}
.joinbox .code{font-size:84px;font-weight:900;letter-spacing:8px;color:var(--bg2);line-height:1.1;direction:ltr}
#qr{display:flex;justify-content:center;margin:12px 0}
.joinbox .url{font-size:13px;color:var(--muted);word-break:break-all;max-width:260px;margin:auto;direction:ltr}
.lobby-r h2{font-size:34px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;max-height:52vh;overflow:auto}
.chip{background:#fff;color:var(--ink);font-weight:700;font-size:20px;padding:8px 18px;border-radius:999px;animation:pop .35s ease}
.chip:hover{background:#ffd6dc;text-decoration:line-through}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.stage-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:18px;gap:12px}
.qtext{background:#fff;color:var(--ink);border-radius:16px;padding:26px;font-size:clamp(26px,4vw,46px);font-weight:700;text-align:center;margin:18px 0}
.qmid{flex:1;display:flex;align-items:center;justify-content:space-between;gap:20px}
.timer{width:130px;height:130px;border-radius:50%;background:var(--bg2);border:6px solid #fff;display:grid;place-items:center;font-size:56px;font-weight:900}
.timer.low{background:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.counter{text-align:center;font-size:22px}
.counter b{display:block;font-size:56px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ====================== שכבת נתונים ====================== */
function splitPath(p) { return p.split('/').filter(Boolean); }
function getAt(tree, parts) { let n = tree; for (const k of parts) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n ?? null; }
function setAt(tree, parts, val) {
  let n = tree;
  for (let i = 0; i < parts.length - 1; i++) { if (typeof n[parts[i]] !== 'object' || n[parts[i]] == null) n[parts[i]] = {}; n = n[parts[i]]; }
  const last = parts[parts.length - 1];
  if (val === null || val === undefined) delete n[last]; else n[last] = JSON.parse(JSON.stringify(val));
}

// מצב בדיקה: localStorage משותף בין לשוניות באותו דפדפן
const LocalDB = {
  key: 'trivia_local_db', subs: [],
  init() { window.addEventListener('storage', e => { if (e.key === this.key) this.emit(); }); },
  read() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  write(t) { localStorage.setItem(this.key, JSON.stringify(t)); this.emit(); },
  emit() {
    const t = this.read();
    for (const s of this.subs) {
      const v = getAt(t, s.parts), j = JSON.stringify(v);

  async get(p) { return getAt(this.read(), splitPath(p)); },
  async set(p, v) { const t = this.read(); setAt(t, splitPath(p), v); this.write(t); },

  async remove(p) { return this.set(p, null); },
  on(p, cb) {
    const s = { parts: splitPath(p), cb, last: undefined };
    this.subs.push(s);
    const v = getAt(this.read(), s.parts); s.last = JSON.stringify(v); cb(v);

  },
  now() { return Date.now(); }
};

// מצב אמיתי: Firebase Realtime Database

  set(p, v) { return this.db.ref(p).set(v); },

};

let actx;
function beep(f, d = .15, type = 'sine', v = .15) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(actx.destination);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}
const ding = () => { beep(660, .15); setTimeout(() => beep(880, .3), 140); };

/* ====================== תמונות וסרטונים (נשמרים במחשב של המנחה) ====================== */
const Media = {
  dbp: null, cache: {},
  open() {
    return this.dbp || (this.dbp = new Promise((res, rej) => {
      const r = indexedDB.open('trivia_media', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
  },
  async put(blob) {
    const id = rid(), db = await this.open();
    await new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    return 'idb:' + id;
  },
  async url(src) {
    if (!String(src).startsWith('idb:')) return src;
    if (this.cache[src]) return this.cache[src];
    const db = await this.open();
    const blob = await new Promise(res => { const r = db.transaction('files').objectStore('files').get(src.slice(4)); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
    return blob ? (this.cache[src] = URL.createObjectURL(blob)) : '';
  }
};
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/); return m && m[1]; };
// opts: auto = מתנגן מיד עם קול, muted = מתנגן בלופ בלי קול
function mediaHtml(ref, cls, opts = {}) {
  if (!ref || !ref.src) return '';
  if (ref.kind === 'youtube') {
    const p = opts.muted ? 'autoplay=1&mute=1&loop=1&controls=0' : (opts.auto ? 'autoplay=1' : '');
    return `<iframe class="${cls}" src="https://www.youtube.com/embed/${ytId(ref.src)}?rel=0&${p}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  }
  if (ref.kind === 'video') {
    const a = opts.muted ? 'muted loop autoplay' : opts.auto ? 'autoplay controls' : 'controls';
    return `<video class="${cls}" data-src="${esc(ref.src)}" ${a} playsinline></video>`;
  }
  return `<img class="${cls}" data-src="${esc(ref.src)}" alt="">`;
}
async function hydrateMedia(root = document) {
  for (const el of root.querySelectorAll('[data-src]')) {
    const src = el.dataset.src; el.removeAttribute('data-src');
    el.src = await Media.url(src);
  }
}

// מנקה שאלות לפני משחק: מוריד תשובות ריקות (בלי טקסט ובלי תמונה) ומעדכן את אינדקס התשובה הנכונה
function normQs(qs) {
  const out = [];
  for (const q of qs || []) {
    const text = String(q.text || '').trim(); if (!text) continue;
    const am = q.amedia || [];
    const pairs = (q.answers || []).map((a, j) => ({ a: String(a || '').trim(), m: am[j] || null, ok: j === q.correct })).filter(p => p.a || p.m);
    const correct = q.poll ? -1 : pairs.findIndex(p => p.ok);
    if (pairs.length < 2 || (!q.poll && correct < 0)) continue;
    const o = { text, answers: pairs.map(p => p.a), correct, time: +q.time || 20, tf: !!q.tf, poll: !!q.poll };
    if (q.media && q.media.src) o.media = q.media;
    if (pairs.some(p => p.m)) o.amedia = pairs.map(p => p.m);
    out.push(o);
  }
  return out;
}
const qType = q => q.poll ? 'poll' : q.tf ? 'tf' : 'mc';

    ...r.questions.map((q, k) => [k + 1, q.text, q.poll ? 'סקר' : 'שאלה', q.answered, q.players, q.poll ? '' : q.correctN, q.poll || !q.players ? '' : Math.round(q.correctN / q.players * 100), q.avgTime ?? ''])]);
  ws1['!cols'] = [{ wch: 6 }, { wch: 18 }, { wch: 10 }, { wch: 14 }, { wch: 8 }, { wch: 8 }, { wch: 8 }];
  ws2['!cols'] = [{ wch: 4 }, { wch: 50 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 16 }];

function importExcel(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      const qs = []; let skipped = 0;
      rows.forEach((row, ri) => {
        const text = String(row[0] ?? '').trim();
        if (!text) return;
        if (ri === 0 && text.includes('שאלה')) return;
        const answers = [1, 2, 3, 4].map(k => String(row[k] ?? '').trim());
        const filled = answers.filter(Boolean);
        const isTf = filled.length === 2 && filled[0] === 'נכון' && filled[1] === 'לא נכון';
        let c = String(row[5] ?? '').trim(), correct = parseInt(c, 10) - 1;
        const isPoll = c === 'סקר';
        if (isPoll) correct = -1;
        else if (isNaN(correct)) correct = answers.findIndex(a => a && a === c);
        const q = { text, answers: isTf ? ['נכון', 'לא נכון'] : answers, correct, time: parseInt(row[6], 10) || 20, tf: isTf && !isPoll, poll: isPoll };
        if (normQs([q]).length) qs.push(q); else skipped++;
      });
      if (!qs.length) return alert('לא נמצאו שאלות תקינות בקובץ. כדאי להוריד את התבנית ולמלא לפיה.');

      alert(`יובאו ${qs.length} שאלות` + (skipped ? `\n${skipped} שורות דולגו כי חסר בהן משהו` : ''));
    } catch (err) { alert('לא הצלחתי לקרוא את הקובץ: ' + err.message); }
  };
  r.readAsArrayBuffer(f);
}

/* ---- ייבוא טופס לקוח (אקסל) ---- */
function shuffleWithCorrect(arr, correctIdx) {
  const items = arr.map((a, i) => ({ a, ok: i === correctIdx }));
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  return { answers: items.map(x => x.a), correct: items.findIndex(x => x.ok) };
}
function parseClientForm(rows) {
  const S = v => String(v ?? '').trim();
  const out = { questions: [], partial: 0, skipped: 0, title: '', theme: '', client: '' };
  const hi = rows.findIndex(r => r.some(c => S(c) === 'שאלה') && r.some(c => S(c).includes('התשובה הנכונה')));
  if (hi < 0) return null;
  for (const r of rows.slice(0, hi)) {
    const label = S(r[1]), val = S(r[2]);
    if (!val) continue;
    if (label.includes('שם האירוע')) out.title = val;
    else if (label.includes('ערכת עיצוב')) out.theme = /dj/i.test(val) ? 'dj' : 'classic';
    else if (label.includes('שם הלקוח') || label.includes('בעל השמחה')) out.client = val;
  }
  const qTime = (editing && editing.settings && editing.settings.qTime) || 20;
  for (const r of rows.slice(hi + 1)) {
    const num = S(r[0]), text = S(r[1]);
    if (!text || num.includes('דוגמה') || !/^\d+$/.test(num)) continue;
    const correct = S(r[2]), wrongs = [r[3], r[4], r[5]].map(S).filter(Boolean), note = S(r[6]);
    if (note.includes('סקר')) {
      const opts = [correct, ...wrongs].filter(Boolean).slice(0, 4);
      if (opts.length < 2) { out.skipped++; continue; }
      out.questions.push({ text, answers: opts, correct: -1, poll: true, tf: false, time: qTime });
      continue;
    }
    if (!correct) { out.skipped++; continue; }
    const TF = ['נכון', 'לא נכון'];
    if (TF.includes(correct) && wrongs.every(w => TF.includes(w))) {
      out.questions.push({ text, answers: TF.slice(), correct: TF.indexOf(correct), tf: true, poll: false, time: qTime });
      continue;
    }
    const opts = [correct, ...wrongs].slice(0, 4);
    if (opts.length < 2) out.partial++;
    const sh = shuffleWithCorrect(opts, 0);
    out.questions.push({ text, answers: sh.answers, correct: sh.correct, tf: false, poll: false, time: qTime });
  }
  return out;
}
function importClientForm(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      const res = parseClientForm(rows);
      if (!res) return alert('זה לא נראה כמו טופס שאלות של לקוח (לא נמצאה שורת כותרות עם "שאלה" ו"התשובה הנכונה"). לייבוא קובץ רגיל השתמשי ב"ייבוא מאקסל" במסך הראשי.');
      if (!res.questions.length) return alert('לא נמצאו בטופס שאלות עם תשובות.');
      addQuestions(res.questions);
      if (res.title && !String(editing.title).trim()) editing.title = res.title;
      if (res.theme) editing.settings.theme = res.theme;
      if (res.client && editing.ev && !editing.ev.client) editing.ev.client = res.client;
      editing.tab = 'q'; renderEditor();
      alert(`נטענו ${res.questions.length} שאלות.` +
        (res.partial ? `\n${res.partial} שאלות בלי תשובות שגויות – צריך להשלים להן תשובות (לשונית "הפעלה" תראה איזה).` : '') +
        (res.skipped ? `\n${res.skipped} שורות דולגו כי לא מולאה בהן תשובה.` : '') +
        '\nסדר התשובות עורבב אוטומטית.');
    } catch (err) { alert('לא הצלחתי לקרוא את הקובץ: ' + err.message); }
  };
  r.readAsArrayBuffer(f);
}

async function saveEventRec(clean, stay) {
  const v = editing.ev, code = cleanCode(v.code);
  if (code.length < 3) { alert('קוד האירוע צריך להיות לפחות 3 תווים'); return false; }
  if (v.from && v.to && v.to < v.from) { alert('תאריך הסיום לפני תאריך ההתחלה'); return false; }
  try {
    if (code !== v.origCode) {
      if (await DB.get('events/' + code)) { alert(`הקוד ${code} כבר תפוס. בחרי קוד אחר.`); return false; }
    }
    const rec = { code, title: clean.title, client: v.client.trim(), from: v.from || '', to: v.to || '', logo: v.logo || null,
      questions: clean.questions, settings: clean.settings, updatedAt: Date.now() };
    if (!v.origCode) rec.createdAt = Date.now();
    await DB.update('events/' + code, rec);
    if (v.origCode && v.origCode !== code) {
      const old = await DB.get('events/' + v.origCode);
      if (old && old.runs) await DB.set('events/' + code + '/runs', old.runs);
      await DB.remove('events/' + v.origCode);
    }
    v.origCode = code; v.code = code; editing.id = 'ev-' + code; editing.isNew = false;
  } catch (e) { alert('השמירה נכשלה: ' + e.message + '\n(צריך להיות מחוברת לאזור הניהול)'); return false; }
  if (!stay) { editing = null; HOME_TAB = 'events'; renderHome(); }
  return true;
}

      <div class="summary" style="justify-content:center"><span>📅 ${evDates(e)}</span><span>❓ ${n} שאלות</span><span>👥 ${JOIN_MODES[jm]}</span></div>
      ${st.k === 'live' && n ? `

async function startClientEvent(code) {
  const e = await DB.get('events/' + code); if (!e) return;
  try { await document.documentElement.requestFullscreen(); } catch (er) {}
  return startSet({ title: e.title, questions: e.questions, settings: e.settings }, { event: { code, logo: e.logo, title: e.title }, onExit: () => renderEventPage(code) });
}

/* ====================== מסך המנחה (המחשב) ====================== */
let H = null;
const gp = sub => `games/${H.code}/${sub}`;

/* ---- מוזיקת רקע ---- */
const Music = {
  on: true, timer: null, audio: null, cfg: null, step: 0,
  CHORDS: [[220, 261.63, 329.63, 110], [174.61, 220, 261.63, 87.31], [196, 261.63, 329.63, 130.81], [196, 246.94, 293.66, 98]],
  playing() { return !!(this.timer || (this.audio && !this.audio.paused)); },
  async play(cfg) {
    if (cfg) this.cfg = cfg;
    const c = this.cfg;
    if (!this.on || !c || c.music === 'none' || this.playing()) return;
    if (c.music === 'file') {
      if (!c.musicFile) return;
      if (!this.audio) { this.audio = new Audio(await Media.url(c.musicFile.src)); this.audio.loop = true; this.audio.volume = .35; }
      this.audio.play().catch(() => {});
      return;
    }
    this.timer = setInterval(() => this.tick(), c.music === 'dj' ? 125 : 214);
  },
  tick() {
    if (this.cfg.music === 'dj') return this.beat();
    const ch = this.CHORDS[Math.floor(this.step / 8) % 4], s = this.step % 8;
    beep(ch[[0, 1, 2, 1, 0, 1, 2, 1][s]] * 2, .12, 'triangle', .035);
    if (s === 0 || s === 4) beep(ch[3], .35, 'sine', .08);
    this.step++;
  },
  // ביט 4/4: בס-תוף, היי-האט, בס ומנגינה קצרה
  beat() {
    const s = this.step % 16, bar = Math.floor(this.step / 16) % 4;
    const root = [110, 87.31, 130.81, 98][bar];
    if (s % 4 === 0) this.kick();
    if (s % 4 === 2) beep(9000, .03, 'square', .012);
    if (s === 4 || s === 12) beep(220, .08, 'triangle', .05);
    if (s % 2 === 0) beep(root * (s % 8 === 6 ? 2 : 1), .12, 'sawtooth', .025);
    if (s === 0 || s === 3 || s === 6 || s === 10) beep(root * [4, 5, 6, 4.5][bar] / 1, .1, 'triangle', .03);
    this.step++;
  },
  kick() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + .15);
      g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .26);
    } catch (e) {}
  },
  pause() { clearInterval(this.timer); this.timer = null; if (this.audio) this.audio.pause(); },
  stop() { this.pause(); this.audio = null; this.step = 0; },
  toggle() {
    this.on = !this.on;
    if (this.on && H && (H.state === 'lobby' || H.state === 'question')) this.play(); else if (!this.on) this.pause();
    const b = $('mbtn'); if (b) b.textContent = this.on ? '🔊' : '🔇';
  }
};

/* ---- מעבר אוטומטי ---- */
function clearAuto() { if (H) { clearInterval(H.auto); H.auto = null; } const l = $('autolbl'); if (l) l.textContent = ''; }
function scheduleAuto() {
  clearAuto();
  if (!H.cfg.autoNext) return;
  const at = Date.now() + H.cfg.resultsSec * 1000;
  H.auto = setInterval(() => {
    const rem = Math.ceil((at - Date.now()) / 1000), l = $('autolbl');
    if (rem <= 0) { clearAuto(); const b = $('main'); if (b) b.click(); }
    else if (l) l.textContent = `ממשיכים אוטומטית בעוד ${rem}…`;
  }, 250);
}

async function startGame(id) {
  const set = loadSets().find(s => s.id === id);
  return startSet(set, { setId: id });
}
async function startSet(set, opts = {}) {
  const qs = normQs(set && set.questions);
  if (!qs.length) return alert('אין במשחק הזה שאלות תקינות');
  const cfg = getSettings(set);
  setTheme(cfg.theme, cfg.djIcons);
  document.body.classList.remove('admin');
  let code;
  for (let k = 0; k < 25; k++) {
    code = String(1000 + Math.floor(Math.random() * 9000));
    const ex = await DB.get(`games/${code}/meta`);
    if (!ex || DB.now() - (ex.created || 0) > 6 * 3600e3) break;
  }
  await DB.remove(`games/${code}`);
  H = { code, title: set.title, qs, cfg, qi: -1, players: {}, answers: {}, state: 'lobby', streak: {}, delta: {}, setId: opts.setId || null, event: opts.event || null, onExit: opts.onExit || null, runId: rid(), startedAt: Date.now(), qStats: [], pstat: {} };
  await DB.set(gp('meta'), {
    state: 'lobby', title: set.title, total: qs.length, created: DB.now(), remoteView: !!cfg.remoteView,
    cfg: { maxPlayers: cfg.maxPlayers, lateJoin: cfg.lateJoin, feedback: cfg.showAnswersPhone, streak: cfg.showStreak, scoring: cfg.scoring, theme: cfg.theme, icons: cfg.djIcons, joinMode: cfg.joinMode }
  });
  H.unsubP = DB.on(gp('players'), v => { H.players = v || {}; onPlayers(); });
  window.onkeydown = e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowLeft') { e.preventDefault(); const b = $('main'); if (b && !b.disabled) b.click(); }
  };
  renderLobby();
  Music.play(cfg);
}

const playerCount = () => Object.keys(H.players).length;
const sortedPlayers = () => Object.entries(H.players).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));

function stageTop(right) {
  return `<div class="stage-top">
    <span style="display:flex;gap:10px;align-items:center">${djLogo()}<span class="pill">${esc(H.title)}</span></span>
    ${right || ''}
    <span>
      ${H.cfg.music !== 'none' ? `<button class="btn ghost" id="mbtn" title="מוזיקה" onclick="Music.toggle()">${Music.on ? '🔊' : '🔇'}</button>` : ''}
      <button class="btn ghost" onclick="toggleFS()">מסך מלא</button>
      <button class="btn ghost" onclick="endHost()">יציאה</button>
    </span>
  </div>`;
}
function toggleFS() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
function endHost() {
  if (H && H.state !== 'end' && !confirm('לצאת מהמשחק?')) return;
  if (H) {
    clearInterval(H.timer); clearAuto(); H.unsubP && H.unsubP(); H.unsubA && H.unsubA();
    if (H.state !== 'end') DB.remove(gp('')); // במשחק שהסתיים משאירים את התוצאות בטלפונים
  }
  Music.stop();
  document.querySelectorAll('.confetti').forEach(d => d.remove());
  const exit = H && H.onExit, wasEvent = H && H.event;
  H = null;
  if (document.fullscreenElement && exit) document.exitFullscreen().catch(() => {});
  if (exit) return exit();
  if (wasEvent) HOME_TAB = 'events';
  renderHome();
}

        <div class="lbl">סורקים את הקוד עם המצלמה</div>
        <div id="qr"></div>
        <div class="lbl">או נכנסים לאתר ומקלידים את הקוד</div>

        <div class="url">${esc(joinBase())}?play</div>
        ${!ONLINE ? `<p><a href="${esc(url)}" target="_blank" style="color:var(--bg2);font-weight:700">פתיחת חלון משתתף לבדיקה ↗</a></p>` : ''}`}
        ${H.cfg.remoteView ? `<div class="watchbox"><div id="wqr"></div><div><b>👁 צפייה מרחוק</b><br><span class="lbl">בלי הצבעה</span><br>
          <button class="mb" onclick="navigator.clipboard.writeText('${esc(wurl)}').then(()=>this.textContent='הועתק ✔')">העתקת קישור</button></div></div>` : ''}
      </div>
      <div class="lobby-r">

        <h2>משתתפים: <span id="pcount">0</span>${max}</h2>
        <div class="chips" id="chips"></div>
        <div class="hint" style="color:#fff;opacity:.7;margin-top:10px">לחיצה על שם מוציאה את המשתתף מהמשחק</div>
      </div>
    </div>
    <div class="stage-bottom"><span></span>${slogan()}<button class="btn primary big" id="main" onclick="nextQ()" disabled>התחלת המשחק ▶</button></div>
  </div>`;
  if ($('qr')) try { new QRCode($('qr'), { text: url, width: 230, height: 230 }); } catch (e) {}
  if (H.cfg.remoteView) try { new QRCode($('wqr'), { text: wurl, width: 90, height: 90 }); } catch (e) {}

function kick(pid) { const p = H.players[pid]; if (p && confirm(`להוציא את ${p.name}?`)) DB.remove(gp('players/' + pid)); }

function onPlayers() {
  if (!H) return;
  if (H.state === 'lobby' && $('chips')) {
    const n = playerCount();
    $('pcount').textContent = n;
    $('main').disabled = n === 0;
    const have = new Set([...$('chips').children].map(c => c.dataset.pid));
    const now = new Set(Object.keys(H.players));
    [...$('chips').children].forEach(c => { if (!now.has(c.dataset.pid)) c.remove(); });
    for (const pid of now) if (!have.has(pid)) {
      const c = document.createElement('span'); c.className = 'chip'; c.dataset.pid = pid;
      c.textContent = H.players[pid].name; c.onclick = () => kick(pid);
      $('chips').appendChild(c); beep(520, .08, 'triangle', .1);
    }
  }
  if (H.state === 'question') updCount();
}

async function nextQ() {
  clearAuto();
  H.qi++;
  if (H.qi >= H.qs.length) return finish();
  const q = H.qs[H.qi];
  H.state = 'question'; H.answers = {}; H.start = DB.now(); H.lastSec = null;
  await DB.update(gp('meta'), {
    state: 'question', i: H.qi, reveal: null, board: null,
    q: { text: q.text, answers: q.answers, tf: q.tf, poll: q.poll, media: !!q.media, pics: q.answers.map((a, j) => !!(q.amedia && q.amedia[j])), dur: q.time, start: H.start }
  });
  H.unsubA && H.unsubA();
  H.unsubA = DB.on(gp('answers/' + H.qi), v => { H.answers = v || {}; updCount(); });
  renderQuestion();
  // סרטון בשאלה — המוזיקה נעצרת כדי שישמעו אותו
  if (q.media && q.media.kind !== 'image') Music.pause(); else Music.play();
  clearInterval(H.timer);
  H.timer = setInterval(tick, 200);
}

function answersHtml(q, revealIdx) {
  return `<div class="answers">${q.answers.map((a, j) => `
    <div class="ans ${revealIdx != null && j !== revealIdx ? 'dim' : ''}" style="background:${ansColor(q, j)}">
      <span class="shape">${q.tf ? (j ? '✘' : '✔') : SHAPES[j]}</span>
      ${q.amedia && q.amedia[j] ? mediaHtml(q.amedia[j], a ? 'am' : 'am big', { muted: true }) : ''}
      <span>${esc(a)}${!q.amedia && q.pics && q.pics[j] ? ' 🖼' : ''}</span>
      ${revealIdx === j ? '<span class="ck">✔</span>' : ''}
    </div>`).join('')}</div>`;
}

function renderQuestion() {
  const q = H.qs[H.qi];
  app.innerHTML = `<div class="stage">
    ${stageTop(`<span class="pill">שאלה ${H.qi + 1} מתוך ${H.qs.length}</span>`)}
    <div class="qtext">${esc(q.text)}</div>
    <div class="tbar" id="tbar"><div id="tfill"></div></div>
    <div class="qmid">
      <div class="timer" id="timer">${q.time}</div>
      <div class="qmedia">${q.poll ? '<span class="polltag" style="font-size:22px">📊 סקר — אין תשובה נכונה</span>' : ''}${mediaHtml(q.media, 'qm', { auto: true })}</div>
      <div class="counter"><b id="acount">0</b>${q.poll ? 'הצביעו' : 'ענו'}</div>
    </div>
    ${answersHtml(q)}
    <div class="stage-bottom"><span></span>${slogan()}<button class="btn ghost" id="main" onclick="reveal()">${q.poll ? 'לתוצאות הסקר ⏭' : 'דילוג לתשובה ⏭'}</button></div>
  </div>`;
  hydrateMedia(app);
  updCount();
}

function answeredCount() { return Object.keys(H.answers).filter(pid => H.players[pid]).length; }
function updCount() {
  if (!H || H.state !== 'question') return;
  if ($('acount')) $('acount').textContent = answeredCount() + ' / ' + playerCount();
  if (playerCount() > 0 && answeredCount() >= playerCount()) reveal();
}

function tick() {
  if (!H || H.state !== 'question') return;
  const q = H.qs[H.qi];
  const rem = Math.max(0, Math.ceil((H.start + q.time * 1000 - DB.now()) / 1000));
  const t = $('timer');
  if (t) { t.textContent = rem; t.classList.toggle('low', rem <= 5); }
  const frac = Math.max(0, (H.start + q.time * 1000 - DB.now()) / (q.time * 1000));
  if ($('tfill')) { $('tfill').style.width = (frac * 100) + '%'; $('tbar').classList.toggle('low', rem <= 5); }
  if (rem !== H.lastSec) { H.lastSec = rem; if (rem <= 5 && rem > 0) beep(440, .1, 'square', .08); }
  if (rem <= 0) reveal();
}

function points(el, time) {
  const s = H.cfg.scoring;
  if (s === 'fixed') return 1000;
  if (s === 'accuracy') return 1;
  return Math.round(500 + 500 * Math.max(0, 1 - el / time));
}

async function reveal() {
  if (!H || H.state !== 'question') return;
  H.state = 'reveal';
  clearInterval(H.timer);
  Music.pause();
  H.unsubA && H.unsubA(); H.unsubA = null;
  const q = H.qs[H.qi];
  const ans = (await DB.get(gp('answers/' + H.qi))) || {};
  const prevRank = {}; sortedPlayers().forEach(([pid], k) => { prevRank[pid] = k + 1; });
  const counts = q.answers.map(() => 0);
  const res = {}, fast = [];
  for (const pid in H.players) {
    const a = ans[pid]; let pts = 0, ok = false, el = null;
    if (a && a.a >= 0 && a.a < counts.length) {
      counts[a.a]++;
      if (!q.poll && a.a === q.correct) {
        ok = true;
        el = Math.max(0, (a.t - H.start) / 1000);
        pts = points(el, q.time);
        fast.push({ name: H.players[pid].name, el: Math.round(el * 10) / 10 });
      }
    }
    if (!q.poll) H.streak[pid] = ok ? (H.streak[pid] || 0) + 1 : 0;
    H.players[pid].score = (H.players[pid].score || 0) + pts;
    res[pid] = { i: H.qi, ok, pts, answered: !!a, poll: q.poll, score: H.players[pid].score, streak: H.streak[pid] || 0 };
  }
  fast.sort((x, y) => x.el - y.el);
  H.fast = fast.slice(0, 3);
  for (const pid in res) {
    const st = H.pstat[pid] = H.pstat[pid] || { correct: 0, answered: 0 };
    if (!q.poll) { st.answered += res[pid].answered ? 1 : 0; st.correct += res[pid].ok ? 1 : 0; }
  }
  H.qStats[H.qi] = {
    text: q.text, poll: q.poll, answers: q.answers, counts, players: playerCount(),
    answered: counts.reduce((x, y) => x + y, 0), correctN: fast.length,
    avgTime: fast.length ? Math.round(fast.reduce((t, f) => t + f.el, 0) / fast.length * 10) / 10 : null
  };
  const upd = {};
  sortedPlayers().forEach(([pid], k) => {
    res[pid].rank = k + 1; res[pid].of = playerCount();
    H.delta[pid] = prevRank[pid] && H.qi > 0 ? prevRank[pid] - (k + 1) : 0;
    upd['players/' + pid + '/score'] = res[pid].score;
    upd['results/' + pid] = res[pid];
  });
  const showC = H.cfg.showCorrect || q.poll;
  upd['meta/state'] = 'reveal';
  upd['meta/reveal'] = { i: H.qi, correct: showC && !q.poll ? q.correct : -1, counts: showC ? counts : null, answered: counts.reduce((x, y) => x + y, 0), fast: H.cfg.showFastest && !q.poll ? H.fast : null };
  await DB.update(gp(''), upd);
  saveRun(false);
  ding();
  renderReveal(counts);
  scheduleAuto();
}

// מה בא אחרי מסך התשובה, לפי ההגדרות
function afterReveal() {
  const q = H.qs[H.qi], c = H.cfg;
  if (H.qi >= H.qs.length - 1) return { fn: 'finish()', label: 'לתוצאות הסופיות 🏆' };
  if (!q.poll && (c.boardWhen === 'each' || (c.boardWhen === 'everyN' && (H.qi + 1) % Math.max(1, c.boardEvery) === 0)))
    return { fn: 'showBoard()', label: 'טבלת המובילים ▶' };
  return { fn: 'nextQ()', label: 'השאלה הבאה ▶' };
}

function renderReveal(counts) {
  const q = H.qs[H.qi], max = Math.max(1, ...counts), nx = afterReveal();
  const showC = H.cfg.showCorrect || q.poll;
  const answered = counts.reduce((x, y) => x + y, 0);
  app.innerHTML = `<div class="stage">
    ${stageTop(`<span class="pill">שאלה ${H.qi + 1} מתוך ${H.qs.length}</span>`)}
    <div class="qtext">${q.poll ? '📊 ' : ''}${esc(q.text)}</div>
    ${showC ? `
    <div class="bars">${counts.map((c, j) => `
      <div class="bar ${!q.poll && j !== q.correct ? 'dim' : ''}">
        <div class="n">${c}</div>
        <div class="b" style="height:${Math.max(4, c / max * 150)}px;background:${ansColor(q, j)}"></div>
      </div>`).join('')}</div>
    <div style="height:18px"></div>
    ${answersHtml(q, q.poll ? null : q.correct)}` : `
    <div class="board" style="text-align:center"><h2>⏰ הזמן נגמר!</h2><div style="font-size:28px">${answered} מתוך ${playerCount()} ענו</div></div>`}
    ${H.cfg.showFastest && !q.poll && H.fast.length ? `<div class="fastest">⚡ הכי מהירים: ${H.fast.map(f => `<span>${esc(f.name)} <small>${f.el} שנ'</small></span>`).join('')}</div>` : ''}
    <div class="stage-bottom"><span class="autolbl" id="autolbl"></span>${slogan()}
      <span>
        ${H.cfg.boardWhen === 'host' && !q.poll && nx.fn === 'nextQ()' ? '<button class="btn ghost big" onclick="showBoard()">טבלת מובילים</button>' : ''}
        <button class="btn primary big" id="main" onclick="${nx.fn}">${nx.label}</button>
      </span>
    </div>
  </div>`;
  hydrateMedia(app);
}

function boardRows(list, from = 0) {
  const c = H.cfg;
  return list.map(([pid, p], k) => {
    const d = H.delta[pid] || 0, st = H.streak[pid] || 0;
    return `<div class="brow" style="animation-delay:${k * .08}s">
      <span><span class="r">${from + k + 1}</span>${esc(p.name)}</span>
      <span class="side">
        ${c.showStreak && st >= 2 ? `<span class="streak">🔥${st}</span>` : ''}
        ${c.showRankChange && d ? `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>` : ''}
        <span>${p.score || 0}</span>
      </span>
    </div>`;
  }).join('');
}
const boardData = list => list.map(([pid, p]) => ({ name: p.name, score: p.score || 0, d: H.delta[pid] || 0, st: H.streak[pid] || 0 }));

async function showBoard() {
  clearAuto();
  H.state = 'board';
  const top = sortedPlayers().slice(0, 5);
  await DB.update(gp('meta'), { state: 'board', board: boardData(top) });
  app.innerHTML = `<div class="stage">
    ${stageTop(`<span class="pill">אחרי ${H.qi + 1} מתוך ${H.qs.length} שאלות</span>`)}
    <div class="board">
      <h2>טבלת המובילים</h2>
      ${boardRows(top)}
    </div>
    <div class="stage-bottom"><span class="autolbl" id="autolbl"></span>${slogan()}<button class="btn primary big" id="main" onclick="nextQ()">השאלה הבאה ▶</button></div>
  </div>`;
  scheduleAuto();
}

function saveRun(finished) {
  const scored = H.qStats.filter(x => x && !x.poll).length;
  const rec = {
    id: H.runId, setId: H.setId, title: H.title, date: H.startedAt, finished, total: H.qs.length, played: H.qStats.filter(Boolean).length,
    players: sortedPlayers().map(([pid, p]) => ({ name: p.name, score: p.score || 0, correct: (H.pstat[pid] || {}).correct || 0, answered: (H.pstat[pid] || {}).answered || 0, of: scored })),
    questions: H.qStats.filter(Boolean)
  };
  if (H.event) { DB.set(`events/${H.event.code}/runs/${H.runId}`, rec).catch(() => {}); return; }
  const runs = loadRuns(), i = runs.findIndex(r => r.id === rec.id);
  if (i >= 0) runs[i] = rec; else runs.unshift(rec);
  try { localStorage.setItem(RUNS_KEY, JSON.stringify(runs.slice(0, 300))); } catch (e) {}
}

async function finish() {
  clearAuto();
  if (H.qStats.length) saveRun(true);
  H.state = 'end';
  clearInterval(H.timer);
  Music.stop();
  const all = sortedPlayers(), show = H.cfg.boardWhen !== 'never';
  await DB.update(gp('meta'), { state: 'end', board: show ? boardData(all.slice(0, 10)) : null });
  const pod = (k, h, color) => all[k] ? `<div class="pod"><div class="nm">${esc(all[k][1].name)}</div><div class="sc">${all[k][1].score || 0} נקודות</div><div class="blk" style="height:${h}px;background:${color}">${k + 1}</div></div>` : '';
  const rest = H.cfg.showBoard && all.length > 3 ? `<div class="biglist">${all.slice(3).map(([, p], k) => `<div><span><b>${k + 4}</b> ${esc(p.name)}</span><span>${p.score || 0}</span></div>`).join('')}</div>` : '';
  app.innerHTML = `<div class="stage">
    ${stageTop()}
    ${show ? `
    <div class="board" style="text-align:center"><h2>🏆 המנצחים 🏆</h2></div>
    <div class="podium">${pod(1, 200, '#c0c0c0')}${pod(0, 280, '#ffcc00')}${pod(2, 140, '#cd7f32')}</div>
    ${rest}` : `<div class="board" style="text-align:center;flex:1"><h2>🎉 המשחק נגמר!</h2><div style="font-size:26px">תודה לכל המשתתפים</div></div>`}
    <div class="stage-bottom"><span></span>${slogan()}<button class="btn primary big" id="main" onclick="endHost()">${H.onExit ? 'סיום' : 'סיום וחזרה למסך הראשי'}</button></div>
  </div>`;
  confetti();
  [523, 659, 784, 1046].forEach((f, k) => setTimeout(() => beep(f, .25, 'triangle', .15), k * 160));
}

function confetti() {
  const cols = ['#ffcc00', '#e21b3c', '#1368ce', '#26890c', '#fff'];
  for (let k = 0; k < 120; k++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = cols[k % cols.length];
    d.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    d.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 7000);
  }
}

/* ====================== מסך המשתתף (הטלפון) ====================== */
const P = { code: '', pid: '', name: '', meta: null, res: null, answeredI: -1, unsub: [], timer: null };
const SESS_KEY = 'trivia_player';
const THEME_CHECKED = {};

function playerJoinScreen(code, err) {
  P.unsub.forEach(u => u()); P.unsub = []; clearInterval(P.timer);
  let last = ''; try { last = (JSON.parse(PSTORE.getItem(SESS_KEY)) || {}).name || ''; } catch (e) {}
  app.innerHTML = `<div class="pwrap">
    <div class="logo">🎯 טריוויה</div>${djLogo()}${slogan()}
    <input id="pcode" inputmode="numeric" maxlength="4" placeholder="קוד המשחק" value="${esc(code || '')}">
    <input id="pname" maxlength="16" placeholder="השם שלך" value="${esc(last)}">
    <button class="btn primary big" onclick="pJoin()">כניסה למשחק</button>
    <div class="perr" id="perr">${esc(err || '')}</div>
  </div>`;
  $(code ? 'pname' : 'pcode').focus();
  // אם כבר יודעים את קוד המשחק — מחילים את ערכת העיצוב שלו
  if (code && !THEME_CHECKED[code]) {
    THEME_CHECKED[code] = 1;
    DB.get(`games/${code}/meta`).then(m => { if (m && m.cfg && m.cfg.theme && m.cfg.theme !== THEME) { setTheme(m.cfg.theme, m.cfg.icons); const n = $('pname') && $('pname').value; playerJoinScreen(code, err); if (n) $('pname').value = n; } });
  }
  $('pname').onkeydown = e => { if (e.key === 'Enter') pJoin(); };
}

async function pJoin(auto) {
  const code = auto ? auto.code : $('pcode').value.trim();
  const name = auto ? auto.name : $('pname').value.trim();
  const err = m => auto ? playerJoinScreen(code) : ($('perr').textContent = m);
  if (!/^\d{4}$/.test(code)) return err('קוד המשחק הוא 4 ספרות');
  if (!name) return err('צריך לכתוב שם');
  const meta = await DB.get(`games/${code}/meta`);
  if (!meta) return err('לא נמצא משחק עם הקוד הזה');
  if (meta.state === 'end') return err('המשחק הזה כבר הסתיים');
  let sess = null; try { sess = JSON.parse(PSTORE.getItem(SESS_KEY)); } catch (e) {}
  const same = !!(sess && sess.code === code && sess.created === meta.created && sess.pid);
  const pid = same ? sess.pid : rid();
  const existing = await DB.get(`games/${code}/players/${pid}`);
  const cfg = meta.cfg || {};
  if (cfg.joinMode === 'clickers') return err('במשחק הזה משחקים עם השלטים, בלי טלפונים');
  if (!existing) {
    if (cfg.lateJoin === false && meta.state !== 'lobby') return err('המשחק כבר התחיל, אי אפשר להצטרף באמצע');
    if (cfg.maxPlayers > 0 && Object.keys((await DB.get(`games/${code}/players`)) || {}).length >= cfg.maxPlayers) return err('המשחק מלא');
  }
  await DB.update(`games/${code}/players/${pid}`, existing ? { name } : { name, score: 0, joined: DB.now() });
  PSTORE.setItem(SESS_KEY, JSON.stringify({ code, pid, name, created: meta.created, answeredI: same ? (sess.answeredI ?? -1) : -1 }));
  Object.assign(P, { code, pid, name, meta: null, res: null, answeredI: same ? (sess.answeredI ?? -1) : -1 });
  P.unsub.push(DB.on(`games/${code}/meta`, v => { P.meta = v; renderPlayer(); }));
  P.unsub.push(DB.on(`games/${code}/results/${pid}`, v => { P.res = v; renderPlayer(); }));
  P.unsub.push(DB.on(`games/${code}/players/${pid}`, v => { if (v === null && P.meta && P.meta.state !== 'end') playerJoinScreen(code, 'הוצאת מהמשחק'); }));
}

function pTop() {
  const score = P.res ? P.res.score : 0;
  return `<div class="ptop"><span>${esc(P.name)}</span><span>${score} נק'</span></div>`;
}

function renderPlayer() {
  clearInterval(P.timer);
  const m = P.meta;
  setTheme(m && m.cfg && m.cfg.theme, m && m.cfg && m.cfg.icons);
  if (!m) { PSTORE.removeItem(SESS_KEY); return playerJoinScreen('', 'המשחק נסגר'); }
  let body = '';
  if (m.state === 'lobby') {
    body = `${djLogo()}${slogan()}<div class="pbig">✔ נכנסת למשחק!</div><div class="psub">רואים את השם שלך על המסך?<br>מחכים שהמשחק יתחיל…</div><div class="spinner"></div>`;
  } else if (m.state === 'question') {
    const q = m.q;
    if (P.answeredI === m.i) {
      body = `<div class="ptop"><span>שאלה ${m.i + 1}/${m.total}</span><span class="ptimer" id="ptimer">${Math.max(0, Math.ceil((q.start + q.dur * 1000 - DB.now()) / 1000))}</span></div>
        <div class="tbar" id="ptbar"><div id="ptfill"></div></div>
        <div class="pbig">${q.poll ? 'ההצבעה נשלחה!' : 'התשובה נשלחה!'}</div><div class="psub">מחכים לשאר המשתתפים…</div><div class="spinner"></div>`;
      P.timer = setInterval(pTick, 250);
      setTimeout(pTick, 0);
    } else {
      body = `<div class="ptop"><span>שאלה ${m.i + 1}/${m.total}</span><span class="ptimer" id="ptimer">${Math.max(0, Math.ceil((q.start + q.dur * 1000 - DB.now()) / 1000))}</span></div>
        <div class="tbar" id="ptbar"><div id="ptfill"></div></div>
        <div class="pq">${q.poll ? '<span class="polltag">📊 סקר</span><br>' : ''}${esc(q.text)}${q.media || (q.pics || []).some(Boolean) ? '<br><b>👀 הסתכלו על המסך</b>' : ''}</div>
        <div class="pgrid ${q.tf ? 'two' : ''}">${q.answers.map((a, j) => `
          <button class="pbtn" style="background:${ansColor(q, j)}" onclick="pAnswer(${j})">
            <span class="shape">${q.tf ? (j ? '✘' : '✔') : SHAPES[j]}</span><span>${esc(a)}${(q.pics || [])[j] ? ' 🖼' : ''}</span>
          </button>`).join('')}</div>`;
      P.timer = setInterval(pTick, 250);
      setTimeout(pTick, 0);
    }
  } else if (m.state === 'reveal' || m.state === 'board') {
    const r = P.res && P.res.i === m.i ? P.res : null;
    const cfg = m.cfg || {}, fb = cfg.feedback !== false;
    if (r && !r.poll && !fb) body = r.answered
      ? `<div class="result none"><div class="ico">✔</div><div class="pbig">התשובה נקלטה</div><div class="psub">התוצאות בסוף המשחק</div></div>`
      : `<div class="result none"><div class="ico">⏰</div><div class="pbig">הזמן נגמר</div></div>`;
    else if (!r) body = `<div class="result none"><div class="ico">⏰</div><div class="pbig">לא נקלטה תשובה</div></div>`;
    else if (r.poll) body = r.answered
      ? `<div class="result none"><div class="ico">📊</div><div class="pbig">תודה על ההצבעה!</div><div class="psub">התוצאות על המסך</div></div>`
      : `<div class="result none"><div class="ico">⏰</div><div class="pbig">לא הספקת להצביע</div></div>`;
    else if (r.ok) body = `<div class="result ok"><div class="ico">✔</div><div class="pbig">נכון!</div><div class="psub">+${r.pts} ${r.pts === 1 ? 'נקודה' : 'נקודות'}</div>${cfg.streak !== false && r.streak >= 2 ? `<div class="psub">🔥 רצף של ${r.streak} תשובות נכונות!</div>` : ''}</div>`;
    else if (r.answered) body = `<div class="result bad"><div class="ico">✘</div><div class="pbig">לא נכון</div><div class="psub">בפעם הבאה!</div></div>`;
    else body = `<div class="result none"><div class="ico">⏰</div><div class="pbig">הזמן נגמר</div></div>`;
    if (r && !r.poll && fb) body += `<div class="psub">מקום <b>${r.rank}</b> מתוך ${r.of}</div>`;
  } else if (m.state === 'end') {
    const r = P.res;
    const medal = r ? (['🥇', '🥈', '🥉'][r.rank - 1] || '🎉') : '🎉';
    body = `${djLogo()}<div class="ico" style="font-size:90px">${medal}</div>${slogan()}<div class="pbig">המשחק נגמר!</div>
      ${r ? `<div class="psub">מקום <b>${r.rank}</b> מתוך ${r.of}<br>${r.score} נקודות</div>` : ''}
      <button class="btn ghost" onclick="PSTORE.removeItem(SESS_KEY);playerJoinScreen('')">משחק חדש</button>`;
  }
  app.innerHTML = `<div class="pwrap">${m.state === 'question' && P.answeredI !== m.i ? '' : pTop()}${body}</div>`;
}

function pTick() {
  const m = P.meta; if (!m || m.state !== 'question') return clearInterval(P.timer);
  const rem = Math.max(0, Math.ceil((m.q.start + m.q.dur * 1000 - DB.now()) / 1000));
  if ($('ptimer')) { $('ptimer').textContent = rem; $('ptimer').classList.toggle('low', rem <= 5); }
  const frac = Math.max(0, (m.q.start + m.q.dur * 1000 - DB.now()) / (m.q.dur * 1000));
  if ($('ptfill')) { $('ptfill').style.width = (frac * 100) + '%'; $('ptbar').classList.toggle('low', rem <= 5); }
  if (rem <= 0 && P.answeredI !== m.i) { clearInterval(P.timer); app.innerHTML = `<div class="pwrap">${pTop()}<div class="pbig">⏰ הזמן נגמר</div><div class="spinner"></div></div>`; }
}

async function pAnswer(j) {
  const m = P.meta; if (!m || m.state !== 'question' || P.answeredI === m.i) return;
  P.answeredI = m.i;
  try { const s = JSON.parse(PSTORE.getItem(SESS_KEY)); s.answeredI = m.i; PSTORE.setItem(SESS_KEY, JSON.stringify(s)); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(40);
  renderPlayer();
  await DB.set(`games/${P.code}/answers/${m.i}/${P.pid}`, { a: j, t: DB.now() });
}

/* ====================== צפייה מרחוק ====================== */
const W = { meta: null, players: {} };
function watchInit(code) {
  DB.on(`games/${code}/meta`, v => { W.meta = v; renderWatch(); });
  DB.on(`games/${code}/players`, v => { W.players = v || {}; if (W.meta && W.meta.state === 'lobby') renderWatch(); });
  setInterval(watchTick, 250);
}
function watchTick() {
  const m = W.meta; if (!m || m.state !== 'question' || !$('timer')) return;
  const left = m.q.start + m.q.dur * 1000 - DB.now(), rem = Math.max(0, Math.ceil(left / 1000));
  $('timer').textContent = rem; $('timer').classList.toggle('low', rem <= 5);
  $('tfill').style.width = Math.max(0, left / (m.q.dur * 1000)) * 100 + '%';
}
function renderWatch() {
  const m = W.meta;
  setTheme(m && m.cfg && m.cfg.theme, m && m.cfg && m.cfg.icons);
  if (!m) { app.innerHTML = `<div class="pwrap"><div class="logo">🎯 טריוויה</div><div class="pbig">המשחק לא נמצא או שהסתיים</div></div>`; return; }
  if (!m.remoteView) { app.innerHTML = `<div class="pwrap"><div class="logo">🎯 טריוויה</div><div class="pbig">צפייה מרחוק לא מופעלת במשחק הזה</div></div>`; return; }
  const rows = list => (list || []).map((p, k) => `<div class="brow"><span><span class="r">${k + 1}</span>${esc(p.name)}</span><span class="side">${p.st >= 2 ? `<span class="streak">🔥${p.st}</span>` : ''}${p.d ? `<span class="delta ${p.d > 0 ? 'up' : 'down'}">${p.d > 0 ? '▲' : '▼'}${Math.abs(p.d)}</span>` : ''}<span>${p.score}</span></span></div>`).join('');
  let body = '';
  if (m.state === 'lobby') {
    const names = Object.values(W.players).map(p => `<span class="chip">${esc(p.name)}</span>`).join('');
    body = `<div class="board" style="text-align:center"><h2>המשחק יתחיל בקרוב…</h2></div><div class="chips" style="justify-content:center">${names}</div>`;
  } else if (m.state === 'question') {
    const q = m.q;
    body = `<div class="qtext">${esc(q.text)}</div><div class="tbar" id="tbar"><div id="tfill"></div></div>
      <div class="qmid"><div class="timer" id="timer">${q.dur}</div><div class="qmedia">${q.poll ? '<span class="polltag" style="font-size:22px">📊 סקר</span>' : ''}${q.media ? '<span class="polltag" style="font-size:22px">🖼 יש תמונה / סרטון במסך באולם</span>' : ''}</div><div></div></div>
      ${answersHtml(q)}`;
  } else if (m.state === 'reveal') {
    const q = m.q, r = m.reveal || {};
    const max = Math.max(1, ...(r.counts || [1]));
    body = `<div class="qtext">${esc(q.text)}</div>
      ${r.counts ? `<div class="bars">${r.counts.map((c, j) => `<div class="bar ${r.correct >= 0 && j !== r.correct ? 'dim' : ''}"><div class="n">${c}</div><div class="b" style="height:${Math.max(4, c / max * 150)}px;background:${ansColor(q, j)}"></div></div>`).join('')}</div><div style="height:18px"></div>${answersHtml(q, r.correct >= 0 ? r.correct : null)}`
        : `<div class="board" style="text-align:center"><h2>⏰ הזמן נגמר!</h2><div style="font-size:28px">${r.answered || 0} ענו</div></div>`}
      ${r.fast && r.fast.length ? `<div class="fastest">⚡ הכי מהירים: ${r.fast.map(f => `<span>${esc(f.name)} <small>${f.el} שנ'</small></span>`).join('')}</div>` : ''}`;
  } else if (m.state === 'board') {
    body = `<div class="board"><h2>טבלת המובילים</h2>${rows(m.board)}</div>`;
  } else if (m.state === 'end') {
    body = m.board ? `<div class="board"><h2>🏆 תוצאות סופיות 🏆</h2>${rows(m.board)}</div>` : `<div class="board" style="text-align:center"><h2>🎉 המשחק נגמר!</h2></div>`;
  }
  app.innerHTML = `<div class="stage"><div class="stage-top"><span style="display:flex;gap:10px;align-items:center">${djLogo()}<span class="pill">${esc(m.title)}</span></span>${m.state === 'question' || m.state === 'reveal' ? `<span class="pill">שאלה ${m.i + 1} מתוך ${m.total}</span>` : ''}<span class="pill">👁 צפייה מרחוק</span></div>${body}</div>`;
  watchTick();
}

/* ====================== הפעלה ====================== */
$('eq').innerHTML = Array.from({ length: 48 }, () => `<i style="animation-delay:-${(Math.random() * .9).toFixed(2)}s;animation-duration:${(.5 + Math.random() * .7).toFixed(2)}s"></i>`).join('');
(async function boot() {
  showBanner();
  const params = new URLSearchParams(location.search);
  if (params.has('watch')) {
    watchInit((params.get('watch') || '').trim());
  } else if (params.has('join') || params.has('play')) {
    const code = (params.get('join') || '').trim();
    let sess = null; try { sess = JSON.parse(PSTORE.getItem(SESS_KEY)); } catch (e) {}
    // חזרה אוטומטית למשחק אם הטלפון התנתק / רוענן
    if (sess && sess.pid && (!code || code === sess.code)) {
      const meta = await DB.get(`games/${sess.code}/meta`);
      if (meta && meta.state !== 'end' && meta.created === sess.created) return pJoin({ code: sess.code, name: sess.name });
    }
    playerJoinScreen(code);
  } else if (params.has('event')) {
    renderEventPage(params.get('event') || '');
  } else {
    renderHome();
    if (ONLINE) firebase.auth().onAuthStateChanged(u => {
      ADMIN = u; AUTH_READY = true;
      if (u && u.email !== ADMIN_EMAIL) { firebase.auth().signOut(); return renderLogin(`החשבון ${u.email} לא מורשה לאזור הניהול`); }
      if (!H && !editing) renderHome();
    });
  }
})();
</script>
</body>
</html>
